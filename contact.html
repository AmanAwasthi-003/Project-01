<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Us</title>
    <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: white;
      color: black;
    }

    header {
      background-color: blue;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      color: blue;
      margin-bottom: 20px;
    }

    .contact-info {
      line-height: 1.8;
      font-size: 16px;
    }

    .contact-info strong {
      display: inline-block;
      width: 120px;
    }

    .message-box {
      margin-top: 30px;
    }

    button {
      background-color: blue;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: blue;
    }

    </style>
  </head>
  <body>
    <header>
      <h1>Contact SoftTech</h1>
    </header>
    <main>
      <h2>We're Here to Help</h2>
      <div class="contact-info">
        <p><strong>Phone:</strong> +91 2345678901</p>
        <p><strong>Support:</strong> +91 9876543210</p>
        <p><strong>Email:</strong>softtechsupport@stemail.com</p>
        <p><strong>Address:</strong>SoftTech World, Vallabh Vidyanagar, Anand, Gujarat, India - 388120</p>
      </div>
      
      <div class="message-box">
        <h3>Need to reach out?</h3>
        <button onclick="sendMessage()">Send Message</button>
      </div>
    </main>
    
    <script>
    function sendMessage() {
    alert("Thank you! Our team will contact you shortly.");
    }
    </script>

  </body>
</html>
